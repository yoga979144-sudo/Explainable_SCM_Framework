{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3"></i>
        <h2 class="fw-bold">404 - Page Not Found</h2>
        <p class="text-secondary">The requested configuration resource, route, or item could not be located in the SCM catalog.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
