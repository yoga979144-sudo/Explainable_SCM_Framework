{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <i class="fa-solid fa-server text-danger display-1 mb-3"></i>
        <h2 class="fw-bold">500 - Internal Server Error</h2>
        <p class="text-secondary">An unexpected exception occurred during configuration lifecycle processing. Transaction has been rolled back safely.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
